name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Egy Node-verzió bukása ne lője ki a másik legjét: a canceled leg semmit nem
      # mond arról, hogy ott átment-e volna, és a hibakeresést félrevezeti.
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # Az npm audit az advisory API-t hívja; a végpont kiesését nem tekintjük
      # kódhibának, valódi találatra viszont bukunk — lásd scripts/audit.sh.
      - run: ./scripts/audit.sh
